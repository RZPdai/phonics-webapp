<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#EAF4FC" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>小小拼读家 · 英语学习工作台</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 五大板块屏幕（内容由 app.js 数据驱动渲染） -->
    <main id="screens">
      <section class="screen" id="screen-dashboard"></section>
      <section class="screen" id="screen-vocab"></section>
      <section class="screen" id="screen-read"></section>
      <section class="screen" id="screen-games"></section>
      <section class="screen" id="screen-achieve"></section>
    </main>

    <!-- 底部导航栏 -->
    <nav id="tabbar">
      <button class="tab active" data-screen="dashboard">
        <span class="tab-ic">📋</span><span class="tab-tx">任务看板</span>
      </button>
      <button class="tab" data-screen="vocab">
        <span class="tab-ic">🔤</span><span class="tab-tx">词汇练习</span>
      </button>
      <button class="tab" data-screen="read">
        <span class="tab-ic">🎤</span><span class="tab-tx">跟读对话</span>
      </button>
      <button class="tab" data-screen="games">
        <span class="tab-ic">🎮</span><span class="tab-tx">互动游戏</span>
      </button>
      <button class="tab" data-screen="achieve">
        <span class="tab-ic">⭐</span><span class="tab-tx">积分成就</span>
      </button>
    </nav>
  </div>

  <!-- 子屏 / 弹窗覆盖层 -->
  <div id="overlay" class="overlay hidden"></div>

  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
